[package]
name = "visual-baseline"
description = "PTY visual-baseline suite against the external frozen oracle"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
autobins = false
autotests = false
autoexamples = false
autobenches = false

[[test]]
name = "visual_baseline"
path = "main.rs"
harness = true

[dependencies]
# Suite pin: the frozen HTML/PNG artifacts were produced with this rev.
# Do not unify onto tools/refactor-proof's later 0a2e490 pin (tiered
# check_with skips HTML/PNG when ansi/txt match).
# termpane v0.1.0 (same git tag as the frozen suite) declares rust-version
# 1.97; compile and run with cargo --ignore-rust-version on rustc 1.88.
tuisnap = { git = "https://github.com/donbeave/tui-snap.git", rev = "2d43458ad2bc37d76653c22d56e61ee74512d893" }

[lints]
workspace = true
