[package]
name = "tablepro"
description = "TablePro terminal database workbench"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tablepro_app"
path = "src/lib.rs"

[[bin]]
name = "tablepro"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tui-next = { package = "junie-tui", path = "../.." }

[dev-dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-segmentation.workspace = true
