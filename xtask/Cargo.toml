[package]
name = "xtask"
description = "Workspace checks: doc-check, boundary, dependency graph"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
syn = { version = "2.0", features = ["full", "visit", "parsing", "extra-traits"] }
cargo_metadata = "0.23"
walkdir = "2.5"
regex = "1.11"
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
