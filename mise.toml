[tools]
rust = "1.98.1"
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"


[tasks.test-all]
description = "Run all non-ignored tests via cargo nextest"
run = "cargo nextest run --locked"

[tasks.verify-conformance]
description = "Verify typed case registry and manifest agreement"
run = "cargo nextest run --test conformance --locked"

[tasks.verify-tuiscotti]
description = "Verify Tuiscotti toolkit qualification and negative mutation gates"
run = "cargo nextest run --test tuiscotti_qualification --locked"
