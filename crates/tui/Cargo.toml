[package]
# TEMPORARY name (COMPONENT_ARCHITECTURE.md §21 item 31, Appendix A "Slice 3"): the root package
# keeps `junie-tui` / `junie_tui` so the legacy tree stays green. This package stays `tui-next` /
# `tui_next` through Slices 5, 6 and 7. The rename to `junie-tui` / `junie_tui` happens in one
# scripted commit *between Slice 7 and Slice 8*, after the root package holds no binaries and no
# consumers (§47.1). Renaming at the start of Slice 5, as Appendix A and Appendix B.1 originally
# said, is struck: it would produce a workspace with two `junie_tui` lib targets, which does not
# resolve (§46.1, invariants S and S2 in §47.3).
name = "tui-next"
description = "Junie-inspired terminal component library (foundations)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "tui_next"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["crossterm"]
# Terminal session (`TerminalSession`, `run()`, `DefaultTerminal`): the only code that names a
# backend. `--no-default-features` compiles the whole paint/theme/layout/text/collection core
# and the runtime without it (§22 §1.2 "core is backend-free").
crossterm = []
# Runtime/Ui inspection surface for the test harness (§17.0 A1, A2). Never in a release binary.
testing = []

[dependencies]
ratatui-core.workspace = true
ratatui-crossterm.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
bitflags.workspace = true

[dev-dependencies]
tui-next-testing.workspace = true
# compile-fail tests for the type-level guarantees of §6.1 and §15
# (`response::must_use_is_enforced`, `response::bitor_is_defined_only_for_unit`,
# `secret::is_not_clone_not_eq`) — §16.1, MA-12.
trybuild.workspace = true
