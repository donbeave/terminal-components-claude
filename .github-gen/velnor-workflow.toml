schema = 1

[generator]
repository = "donbeave/terminal-components-claude"
revision = "1048337062ea625fada1b4f7c07f2feed75f60c7"

# GitHub-hosted only. Do not enable a Velnor lane: this repository has no
# self-hosted runner labels.
[workflow]
runners = "github"
default_branch = "main"

# Nested workspace fixtures and historical evidence crates are not product CI.
# `tests/visual_baseline` is already ignored (manifests under tests/).
[scan]
exclude = [
  "xtask/fixtures/**",
  "docs/refactoring-plan/evidence/**",
]

[[static_files]]
file = ".github/workflows/AGENTS.md"
source = ".github-gen/sources/workflows-AGENTS.md"

# Cargo gates run on rust-xtask so they inherit rustc from the unit job.
# scheduled-checks jobs use mise-action `install: false` and never provision
# a toolchain; extra-gates stays lychee-only. Collapsed rust kind env must
# agree across units, so rust-xtask cannot set BLESS_GUARD_BASE; the mise
# task computes it from GITHUB_BASE_REF / GITHUB_SHA.
[[units]]
id = "rust-xtask"
ci_tasks = [
  "boundary",
  "bless-guard",
  "doc-check",
  "rustdoc",
  "perf",
  "workspace-nextest",
]
mise_tools = ["aqua:nextest-rs/nextest/cargo-nextest"]

# Repo-wide lychee, including push coverage on the campaign branch.
# `[workflow]` has no extra_branches / additional_branches / push_branches
# field; scheduled-checks `events` + `branches` is the typed substitute.
[[check_profile]]
id = "lychee"
name = "Markdown links"
tools = ["aqua:lycheeverse/lychee"]
tasks = ["lychee"]
timeout_minutes = 20

[[declare]]
primitive = "scheduled-checks"
file = "ci-extra-gates.yml"

[declare.args]
name = "Extra gates"
profiles = ["lychee"]
events = ["push", "pull_request"]
branches = ["main", "refactor/holla-parity"]
