schema = 1

[generator]
repository = "donbeave/terminal-components-claude"
revision = "1048337062ea625fada1b4f7c07f2feed75f60c7"

# GitHub-hosted only. Do not enable a Velnor lane: this repository has no
# self-hosted runner labels.
[workflow]
runners = "github"
default_branch = "main"

# Nested workspace fixtures and historical evidence crates are not product CI.
# `tests/visual_baseline` is already ignored (manifests under tests/).
[scan]
exclude = [
  "xtask/fixtures/**",
  "docs/refactoring-plan/evidence/**",
]

[[static_files]]
file = ".github/workflows/AGENTS.md"
source = ".github-gen/sources/workflows-AGENTS.md"

# `[workflow]` has no extra_branches key; ci-main is default_branch `main`
# only. scheduled-checks `events` + `branches` is the campaign-push substitute.
# Profile `tools` renders mise-action `install_args` (rustc via core:rust).
# The follow-up `install: false` step still runs; it does not install tools.
[[check_profile]]
id = "boundary"
name = "Boundary"
tools = ["rust"]
tasks = ["boundary"]
timeout_minutes = 45

[[check_profile]]
id = "bless-guard"
name = "Bless guard"
tools = ["rust"]
tasks = ["bless-guard"]
timeout_minutes = 45
env = { BLESS_GUARD_BASE = "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}" }

[[check_profile]]
id = "doc-check"
name = "Doc check"
tools = ["rust"]
tasks = ["doc-check"]
timeout_minutes = 45

[[check_profile]]
id = "rustdoc"
name = "Rustdoc"
tools = ["rust"]
tasks = ["rustdoc"]
timeout_minutes = 60

[[check_profile]]
id = "lychee"
name = "Markdown links"
tools = ["aqua:lycheeverse/lychee"]
tasks = ["lychee"]
timeout_minutes = 20

[[check_profile]]
id = "perf"
name = "Library perf"
tools = ["rust", "aqua:nextest-rs/nextest/cargo-nextest"]
tasks = ["perf"]
timeout_minutes = 90

[[check_profile]]
id = "workspace-nextest"
name = "Workspace nextest"
tools = ["rust", "aqua:nextest-rs/nextest/cargo-nextest"]
tasks = ["workspace-nextest"]
timeout_minutes = 90

[[declare]]
primitive = "scheduled-checks"
file = "ci-extra-gates.yml"

[declare.args]
name = "Extra gates"
profiles = ["boundary", "bless-guard", "doc-check", "rustdoc", "lychee", "perf", "workspace-nextest"]
events = ["push", "pull_request"]
branches = ["main", "refactor/holla-parity"]
