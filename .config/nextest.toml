# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# Default: `cargo nextest run`
# Visual baseline: `cargo nextest run --run-ignored only -E 'binary(visual_baseline)'`
# HTML report: `cargo nextest run --run-ignored only --ignore-default-filter -E 'test(rebuild_review_html)'`

[test-groups]
# Real TUI binaries in PTYs; per-combo tests saturate this pool in parallel.
pty = { max-threads = 16 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }
# The HTML report re-verifies every actual; it is a publish step, not the
# capture gate.
default-filter = "not test(rebuild_review_html)"

[[profile.default.overrides]]
filter = "binary(visual_baseline)"
test-group = "pty"
# One PTY per combo test; 60s is enough for a single capture.
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
default-filter = "not test(rebuild_review_html)"

# PR CI: smoke matrix (120×40 truecolor). support.rs enables it when
# NEXTEST_PROFILE=ci or TUISNAP_MATRIX=smoke is set in the workflow.
[[profile.ci.overrides]]
filter = "binary(visual_baseline)"
test-group = "pty"
slow-timeout = { period = "60s", terminate-after = 4 }
