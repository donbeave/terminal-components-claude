# cargo-nextest config. Process-per-test isolation is the default and is
# required for PTY captures (libtest --test-threads shares one process).
#
# Default: `cargo nextest run` (default-members only; does not require the oracle)
# Visual baseline is a workspace member but not a default-member, so the
# binary(visual_baseline) filter needs `--workspace` or `-p visual-baseline`.
# Frozen termpane pin declares rust-version 1.97; rustc 1.88 needs
# `--ignore-rust-version`.
#
# Store integrity (no PTY):
#   VISUAL_BASELINE_STORE=.../snapshots cargo nextest run --ignore-rust-version \
#     --workspace -E 'binary(visual_baseline) & test(store_integrity)'
# PTY matrix:
#   cargo nextest run --ignore-rust-version --workspace --run-ignored only \
#     -E 'binary(visual_baseline)'
# HTML report: `cargo nextest run --run-ignored only --ignore-default-filter -E 'test(rebuild_review_html)'`

[test-groups]
# Real TUI binaries in PTYs. The tag used max-threads = 8; eight concurrent
# captures starved boot needles and tripped 15s-class timeouts under load.
# Cap at 2 (matches the known-good control's NEXTEST_TEST_THREADS default).
pty = { max-threads = 2 }
# Verifier tests spawn observer/provider processes. Workspace nextest under
# CI contention let provider_hang cleanup exceed the 4s bound (12.62s).
# Serialize the package (matches local `-j 1 --package refactor-proof`).
# Applied on profile.default: CI does not set NEXTEST_PROFILE=ci.
refactor-proof = { max-threads = 1 }

[profile.default]
fail-fast = false
slow-timeout = { period = "60s" }
# The HTML report re-verifies every actual; it is a publish step, not the
# capture gate.
default-filter = "not test(rebuild_review_html)"

[[profile.default.overrides]]
filter = "binary(visual_baseline)"
test-group = "pty"
# One PTY+PNG raster per test (size×color unbundled). Do not raise this.
slow-timeout = { period = "60s", terminate-after = 10 }

[[profile.default.overrides]]
filter = '''
  test(scrolling)
  or test(tablepro_audit)
  or test(holla_audit)
  or test(jackin_audit)
  or test(showcase_audit)
  or test(terminal_default)
  or test(docker_done)
'''
threads-required = 2

[[profile.default.overrides]]
filter = "package(refactor-proof)"
test-group = "refactor-proof"

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }
