[workspace]
resolver = "3"
members = ["crates/tui", "crates/tui-testing", "apps/tablepro", "xtask"]
# The root package itself is automatically a member; `cargo build` never compiles xtask.
default-members = [".", "crates/tui", "crates/tui-testing", "apps/tablepro"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/donbeave/terminal-components-claude"

[workspace.dependencies]
# `tui-next` is the TEMPORARY name of `crates/tui` (COMPONENT_ARCHITECTURE.md §21 item 31). It is
# kept through Slices 5, 6 and 7 and renamed to `junie-tui` / `junie_tui` in one scripted commit
# between Slice 7 and Slice 8 (§47.1); the earlier "start of Slice 5" plan is struck by §46.1.
tui-next = { path = "crates/tui" }
tui-next-testing = { path = "crates/tui-testing" }
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "underline-color"] }
ratatui-crossterm = { version = "0.1.2" } # default = crossterm_0_29 + underline-color
unicode-width = "0.2.2"
unicode-segmentation = "1.13"
bitflags = "2.13"
trybuild = "1.0"

[workspace.lints.rust]
unsafe_code = "deny"                          # crates/tui raises to forbid at the crate root
missing_docs = "warn"                         # crates/tui raises to deny at the crate root
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }       # correctness + suspicious + style + complexity + perf
pedantic = { level = "warn", priority = -1 }

# denied individually — each maps to a stated invariant, not to taste
panic = "deny"                                # goal §10 "no panics during normal interaction"
indexing_slicing = "deny"                     # the structural fix for §1.3's ragged-row panics
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"                                 # goal §29 "no material TODO / stub"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"                         # a TUI library must never write to stdout
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"

# warned, not denied — real signal, too noisy to block on
arithmetic_side_effects = "warn"              # the rule is saturating_* (R5); deny would flood
missing_panics_doc = "warn"
missing_errors_doc = "warn"

# allowed with reasons
must_use_candidate = "allow"                  # noise; #[must_use] is applied deliberately (Response)
module_name_repetitions = "allow"
cast_possible_truncation = "allow"            # u16 terminal coordinates — ratatui itself allows these four
cast_sign_loss = "allow"                      #   (ratatui-core-0.1.2/Cargo.toml:179-182); staying
cast_precision_loss = "allow"                 #   consistent with the ecosystem we live inside
cast_possible_wrap = "allow"

[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

[lib]
name = "junie_tui"
path = "src/lib.rs"

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"

[[bin]]
name = "jackin-preview"
path = "src/bin/jackin_preview/main.rs"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
