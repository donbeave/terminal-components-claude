[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

[dependencies]
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[profile.release]
lto = "thin"
codegen-units = 1
