[package]
name = "junie-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Junie-inspired Ratatui design-system laboratory"
license = "MIT"

default-run = "showcase"

[lib]
name = "junie_tui"
path = "src/lib.rs"
doctest = false

[[bin]]
name = "showcase"
path = "src/bin/showcase/main.rs"

[[bin]]
name = "tablepro"
path = "src/bin/tablepro/main.rs"

[[bin]]
name = "jackin-preview"
path = "src/bin/jackin_preview/main.rs"

[[bin]]
name = "holla"
path = "src/bin/holla/main.rs"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
ratatui = { version = "0.30", features = ["crossterm_0_29"] }
unicode-width = "0.2"
unicode-segmentation = "1"

[dev-dependencies]
tuiscotti = { git = "https://github.com/tailrocks/tuiscotti", rev = "a47c9aaefb34e4c00026f99d8a8dd7ee5916b274", features = ["pty"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3"
image = "0.25"
sha2 = "0.10"
rayon = "1.10"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.test.package."*"]
opt-level = 3
