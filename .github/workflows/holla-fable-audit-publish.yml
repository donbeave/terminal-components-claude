          repo = os.environ['REPO']
          head = os.environ['GITHUB_SHA']
          assert repo == 'donbeave/terminal-components-claude'
          assert os.environ['GITHUB_REF'] == 'refs/heads/holla-fable'

          def api(method, path, body=None):
              request = urllib.request.Request(
                  'https://api.github.com/repos/' + repo + path,
                  data=json.dumps(body).encode() if body is not None else None,
                  method=method,
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)

          commit = api('GET', '/git/commits/' + head)
          assert [p['sha'] for p in commit['parents']] == [data['base']], 'Concurrent changes: stop and reconcile'
          assert api('GET', '/git/ref/heads/holla-fable')['object']['sha'] == head, 'Branch moved: stop'
          patch = Path('/tmp/holla-fable-verified.patch')
          patch.write_text(data['patch'])
          subprocess.run(['git', 'apply', '--check', str(patch)], check=True)
          subprocess.run(['git', 'apply', str(patch)], check=True)
          subprocess.run([sys.executable, 'scripts/audit/inventory.py'], check=True)
          Path('.github/workflows/holla-fable-audit-publish.yml').unlink()
          expected = data['expected']
          for name, digest in expected.items():
              path = Path(name)
              assert not path.is_absolute() and '..' not in path.parts
              if digest is None:
                  assert not path.exists(), name
              else:
                  assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Content mismatch: ' + name
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines())
          assert changed == set(expected), 'Unexpected or missing paths: ' + str(changed ^ set(expected))

          def upload(item):
              name, digest = item
              entry = {'path': name, 'mode': '100644', 'type': 'blob', 'sha': None}
              if digest is not None:
                  content = Path(name).read_bytes()
                  blob = api('POST', '/git/blobs', {'content': base64.b64encode(content).decode(), 'encoding': 'base64'})
                  expected_sha = hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
                  assert blob['sha'] == expected_sha, name
                  entry['sha'] = blob['sha']
              return entry

          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:
              entries = list(pool.map(upload, expected.items()))
          assert api('GET', '/git/ref/heads/holla-fable')['object']['sha'] == head, 'Branch moved: do not publish a commit'
          tree = api('POST', '/git/trees', {'base_tree': commit['tree']['sha'], 'tree': entries})
          print('PARENT_COMMIT_SHA=' + head)
          print('PUBLISHED_TREE_SHA=' + tree['sha'])
          print('VERIFIED_CHANGED_PATHS=' + str(len(entries)))
          print('Only immutable objects were uploaded; no branch ref was changed.')
          PY
