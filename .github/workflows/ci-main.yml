                success) ;;
                skipped) echo "expected CI job github-hosted-rust-holla was skipped: a skipped expected result cannot pass" >&2; exit 1 ;;
                cancelled) echo "expected CI job github-hosted-rust-holla was cancelled: a cancelled expected result cannot pass" >&2; exit 1 ;;
