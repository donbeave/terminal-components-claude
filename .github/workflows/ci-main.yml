                skipped) ;;
                *) echo "selected CI job github-rust-jackin-preview ran outside its lane admission (LANE_ADMITTED_GITHUB=$LANE_ADMITTED_GITHUB): $result" >&2; exit 1 ;;
              esac
            fi
