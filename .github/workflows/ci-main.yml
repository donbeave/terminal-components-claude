              *) echo "unexpected CI job github-hosted-rust-msrv ran outside the expected set: $result" >&2; exit 1 ;;
            esac
          fi
  required:
    name: "Control / Required"
    if: ${{ always() }}
    needs: [ci-required]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Mirror CI / Required
        if: ${{ needs.ci-required.result != 'success' }}
        run: exit 1
