    if: ${{ always() && needs.plan.result == 'success' && needs.policy.result == 'success' && contains(format(',{0},', needs.plan.outputs.units), ',rust-xtask,') && (github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.runner == 'github' || github.event.inputs.runner == 'both' || github.event.inputs.runner == ''))) }}
    needs: [plan, policy]
    uses: ./.github/workflows/ci-unit-rust.yml
    with:
      unit: rust-xtask
      lane: github
      selected_units: ${{ needs.plan.outputs.units }}
      scope: ${{ needs.plan.outputs.scope }}
      full_units: ${{ needs.plan.outputs.full_units }}
      base_sha: ${{ needs.plan.outputs.base_sha }}
