# Generated by velnor-workflow. Regenerate; do not hand-edit.
name: Perf
run-name: "Perf · ${{ github.event_name }}"

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf:
    name: "perf (allocations and bytes, blocking)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      BLESS_GUARD_BASE: "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Run ci-perf-contract
        run: mise run ci-perf-contract
      - name: Run ci-gates-bless-guard
        run: mise run ci-gates-bless-guard
      - name: Run ci-perf-lib
        run: mise run ci-perf-lib
      - name: Run ci-perf-apps
        run: mise run ci-perf-apps
      - name: Run ci-perf-no-rebless
        run: mise run ci-perf-no-rebless
      - name: Run ci-perf-collect
        run: mise run ci-perf-collect
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf
          path: |
            perf-lines.txt
            perf-*.log
          if-no-files-found: warn
  perf-strict:
    name: "perf (wall clock, advisory)"
    needs: [perf]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: true
    env:
      CARGO_TERM_COLOR: always
      PERF_STRICT: "1"
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false
      - name: Run ci-perf-strict-lib
        run: mise run ci-perf-strict-lib
      - name: Run ci-perf-strict-apps
        run: mise run ci-perf-strict-apps
      - name: Upload perf-strict artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: perf-strict
          path: |
            perf-strict-*.log
          if-no-files-found: warn
