name: Perf

# Gate → requirement map. COMPONENT_ARCHITECTURE.md §16.6 adopts
# `docs/audit/performance-audit.md` §7.3's CI wiring verbatim:
#
#   job `perf`         — always on, BLOCKING. Allocation and byte counts are
#                        deterministic, so they are hard assertions (§16.6). This is
#                        the column that guards the "< 20 allocs/frame"-class
#                        thresholds and the `viewport_100k_lines_render` acceptance.
#   job `perf-strict`  — PERF_STRICT=1, `continue-on-error: true` BY DESIGN. Under
#                        PERF_STRICT wall time is asserted against `baseline × 1.2`
#                        (§16.6: "Wall time is reported always, asserted only under
#                        PERF_STRICT=1"). Wall clocks on a shared GitHub runner are
#                        machine-sensitive; the allocation and byte columns above are
#                        the hard ones. Do not add continue-on-error to anything else.
#   PERF artefact      — §16.6 "PERF lines are collected into a build artefact for the
#                        final report" (goal §30 item 13).
#   baseline is not re-blessed in CI — §25.12 F18: `perf_baseline.txt` is regenerated
#                        only with PERF_BLESS=1, reviewed in the diff, in the same
#                        commit as the code change. CI asserts it did not move.
#
# `--test-threads=1`: allocation counts are process-wide but the harness serialises
# them through its own lock, so BLESSING IS THREAD-COUNT INDEPENDENT — the flag is no
# longer required for correctness (§16.6). It is kept because the perf suite still
# wants a quiet machine for stable wall times, which is exactly what the PERF_STRICT
# job asserts against. Removing it would make the strict job noisier, not wrong.
#
# `-p junie-tui --test perf --test perf_collections` selects the two library perf
# processes (`perf.rs` foundations and `perf_collections.rs` collections; §66).
# Each application owns an integration benchmark at `apps/<app>/tests/perf.rs`,
# with its own package-qualified command and baseline below.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  perf:
    name: perf (allocations and bytes, blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The guard must compare this revision with the pushed commit or PR base;
      # a shallow checkout or a HEAD fallback would make the check vacuous.
      - name: Baseline bless guard
        env:
          BLESS_GUARD_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: cargo run -p xtask -- bless-guard
      # The default `run` shell is `bash -e -o pipefail`, so a cargo failure ahead of
      # `tee` still fails the step.
      - name: Library perf (foundation and collections)
        run: |
          cargo test -p junie-tui --test perf --test perf_collections --release -- --test-threads=1 --nocapture 2>&1 | tee perf-lib.log
      - name: Showcase perf
        run: |
          cargo test -p showcase --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-showcase.log
      - name: TablePro perf
        run: |
          cargo test -p tablepro --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-tablepro.log
      - name: Jackin perf
        run: |
          cargo test -p jackin-preview --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-jackin.log
      # §25.12 F18: a perf run must never re-bless. Only PERF_BLESS=1 rewrites these,
      # and that happens in the commit that changes the code, reviewed in the diff.
      - name: Baselines were not re-blessed (§25.12 F18)
        run: git diff --exit-code tests/perf_baseline.txt crates/tui/tests/perf_baseline.txt apps/showcase/tests/perf_baseline.txt apps/tablepro/tests/perf_baseline.txt apps/jackin-preview/tests/perf_baseline.txt
      # §16.6 / goal §30 item 13.
      - name: Collect PERF lines
        if: always()
        run: grep -h '^PERF' perf-*.log > perf-lines.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-lines
          path: |
            perf-lines.txt
            perf-*.log

  perf-strict:
    name: perf (wall clock, advisory)
    runs-on: ubuntu-latest
    # The one sanctioned continue-on-error in this repository: §16.6 asserts wall time
    # only under PERF_STRICT=1, and a shared runner cannot hold a 1.2× band.
    continue-on-error: true
    env:
      PERF_STRICT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Library perf (foundation and collections, strict)
        run: |
          cargo test -p junie-tui --test perf --test perf_collections --release -- --test-threads=1 --nocapture 2>&1 | tee perf-strict-lib.log
      - name: Showcase perf (strict)
        run: |
          cargo test -p showcase --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-strict-showcase.log
      - name: TablePro perf (strict)
        run: |
          cargo test -p tablepro --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-strict-tablepro.log
      - name: Jackin perf (strict)
        run: |
          cargo test -p jackin-preview --test perf --release -- --test-threads=1 --nocapture 2>&1 | tee perf-strict-jackin.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-lines-strict
          path: perf-strict-*.log
