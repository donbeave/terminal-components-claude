# Standalone adapter workspace. Empty [workspace] keeps this crate out of the
# repository root workspace; path-deps resolve production crates without
# adding a root member.
[workspace]

[package]
name = "oracle-showcase"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false
description = "TASK-002 Showcase reference observation/clock adapter (oracle-showcase)"

[lib]
name = "oracle_showcase"
path = "src/lib.rs"

[dependencies]
showcase = { path = "../../../apps/showcase" }
junie-tui = { path = "../../../crates/tui", default-features = false, features = ["crossterm", "testing"] }
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "underline-color"] }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
mem_forget = "deny"
arithmetic_side_effects = "warn"
missing_panics_doc = "warn"
missing_errors_doc = "warn"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
