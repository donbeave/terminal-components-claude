[package]
name = "oracle-holla"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
license = "MIT"
description = "TASK-003 Holla oracle reference observation adapter"

[workspace]

[lib]
name = "oracle_holla"
path = "src/lib.rs"

[dependencies]
holla = { path = "../../../apps/holla" }
junie-tui = { path = "../../../crates/tui", default-features = false, features = ["testing"] }
junie-tui-testing = { path = "../../../crates/tui-testing" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
