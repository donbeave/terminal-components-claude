[package]
name = "jackin-adapter"
description = "Reference observation adapter for Jackin oracle capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[dependencies]
jackin-preview = { path = "../../../apps/jackin-preview" }
junie-tui = { path = "../../../crates/tui", features = ["crossterm", "testing"] }
junie-tui-testing = { path = "../../../crates/tui-testing" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "deny"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
