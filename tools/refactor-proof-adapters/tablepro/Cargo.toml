[package]
name = "oracle-tablepro"
description = "TASK-005 TablePro oracle observation adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace]

[lib]
name = "oracle_tablepro"
path = "src/lib.rs"

[[bin]]
name = "tablepro"
path = "src/bin/tablepro.rs"

[dependencies]
tablepro_app = { package = "tablepro", path = "../../../apps/tablepro", version = "0.1.0" }
junie-tui = { path = "../../../crates/tui", version = "0.1.0", features = ["crossterm", "testing"] }
junie-tui-testing = { path = "../../../crates/tui-testing", version = "0.1.0" }

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
panic = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
must_use_candidate = "allow"
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
